name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_NAME: sanity-plugin-bulk-delete

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set package version from release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          node - "$VERSION" <<'NODE'
          const fs = require('node:fs');
          const version = process.argv[2];
          const numeric = '(?:0|[1-9]\\d*)';
          const prereleaseIdentifier = '(?:0|[1-9]\\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)';
          const semver = new RegExp(
            `^${numeric}\\.${numeric}\\.${numeric}(?:-${prereleaseIdentifier}(?:\\.${prereleaseIdentifier})*)?(?:\\+[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?$`,
          );

          if (!process.env.RELEASE_TAG.startsWith('v') || !semver.test(version)) {
            console.error(`Release tag must be v followed by a valid SemVer version: ${process.env.RELEASE_TAG}`);
            process.exit(1);
          }

          const distTag = version.split('+', 1)[0].includes('-') ? 'next' : 'latest';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ndist_tag=${distTag}\n`);
          NODE
          npm version "$VERSION" --no-git-tag-version --allow-same-version --ignore-scripts --package-lock=false

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "package.json version $PACKAGE_VERSION does not match release tag version $VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Build package
        run: npm run build

      - name: Pack package
        run: npm pack --ignore-scripts

      - name: Upload package tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-package
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish package
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check npm trusted publishing support
        run: |
          NPM_VERSION="$(npm --version)"
          node - "$NPM_VERSION" <<'NODE'
          const version = process.argv[2];
          const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(version);
          const minimum = [11, 5, 1];
          const actual = match?.slice(1).map(Number);
          let meetsMinimum = Boolean(actual);
          for (let index = 0; meetsMinimum && index < minimum.length; index += 1) {
            if (actual[index] !== minimum[index]) {
              meetsMinimum = actual[index] > minimum[index];
              break;
            }
          }
          if (!meetsMinimum) {
            console.error(`npm ${version} is below the required version 11.5.1`);
            process.exit(1);
          }
          NODE

      - name: Download package tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: npm-package

      - name: Verify package tarball
        env:
          EXPECTED_NAME: ${{ env.PACKAGE_NAME }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          shopt -s nullglob
          tarballs=( *.tgz )
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "Expected exactly one package tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          TARBALL="${tarballs[0]}"
          tar -xOf "$TARBALL" package/package.json | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => input += chunk);
            process.stdin.on("end", () => {
              const pkg = JSON.parse(input);
              if (pkg.name !== process.env.EXPECTED_NAME || pkg.version !== process.env.EXPECTED_VERSION) {
                console.error(`Tarball identity mismatch: expected ${process.env.EXPECTED_NAME}@${process.env.EXPECTED_VERSION}, got ${pkg.name}@${pkg.version}`);
                process.exit(1);
              }
            });
          '
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Publish with provenance
        env:
          NPM_DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: |
          if [ "$NPM_DIST_TAG" = "next" ]; then
            npm publish "$TARBALL" --provenance --ignore-scripts --tag next
          else
            npm publish "$TARBALL" --provenance --ignore-scripts
          fi
