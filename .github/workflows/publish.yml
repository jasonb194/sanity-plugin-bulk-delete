name: Publish to npm

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_NAME: sanity-plugin-bulk-delete

jobs:
  analyze:
    name: Calculate release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      should_publish: ${{ steps.release.outputs.should_publish }}
      should_tag: ${{ steps.release.outputs.should_tag }}
      baseline_version: ${{ steps.release.outputs.baseline_version }}
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Read published npm versions
        run: |
          npm view "$PACKAGE_NAME@latest" version gitHead --json > npm-latest.json
          npm view "$PACKAGE_NAME" versions --json > npm-versions.json

      - name: Calculate release plan
        id: release
        env:
          TARGET_SHA: ${{ github.sha }}
        run: node .github/scripts/calculate-release.mjs

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: analyze
    if: needs.analyze.outputs.should_publish == 'true'
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set package version for this build
        env:
          RELEASE_VERSION: ${{ needs.analyze.outputs.version }}
        run: |
          npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts --package-lock=false
          npm pkg set "gitHead=$GITHUB_SHA"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          PACKAGE_GIT_HEAD="$(node -p "require('./package.json').gitHead")"
          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "package.json version $PACKAGE_VERSION does not match calculated version $RELEASE_VERSION" >&2
            exit 1
          fi
          if [ "$PACKAGE_GIT_HEAD" != "$GITHUB_SHA" ]; then
            echo "package.json gitHead $PACKAGE_GIT_HEAD does not match release commit $GITHUB_SHA" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Build package
        run: npm run build

      - name: Pack package
        run: npm pack --ignore-scripts

      - name: Upload package tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-package
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish package
    runs-on: ubuntu-latest
    needs: [analyze, build]
    if: needs.analyze.outputs.should_publish == 'true'
    permissions:
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check npm trusted publishing support
        run: |
          NPM_VERSION="$(npm --version)"
          node - "$NPM_VERSION" <<'NODE'
          const version = process.argv[2];
          const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(version);
          const minimum = [11, 5, 1];
          const actual = match?.slice(1).map(Number);
          let meetsMinimum = Boolean(actual);
          for (let index = 0; meetsMinimum && index < minimum.length; index += 1) {
            if (actual[index] !== minimum[index]) {
              meetsMinimum = actual[index] > minimum[index];
              break;
            }
          }
          if (!meetsMinimum) {
            console.error(`npm ${version} is below the required version 11.5.1`);
            process.exit(1);
          }
          NODE

      - name: Download package tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: npm-package

      - name: Verify package tarball
        env:
          EXPECTED_NAME: ${{ env.PACKAGE_NAME }}
          EXPECTED_VERSION: ${{ needs.analyze.outputs.version }}
          EXPECTED_GIT_HEAD: ${{ github.sha }}
        run: |
          shopt -s nullglob
          tarballs=( *.tgz )
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "Expected exactly one package tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          TARBALL="${tarballs[0]}"
          tar -xOf "$TARBALL" package/package.json | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => input += chunk);
            process.stdin.on("end", () => {
              const pkg = JSON.parse(input);
              if (pkg.name !== process.env.EXPECTED_NAME || pkg.version !== process.env.EXPECTED_VERSION || pkg.gitHead !== process.env.EXPECTED_GIT_HEAD) {
                console.error(`Tarball identity mismatch: expected ${process.env.EXPECTED_NAME}@${process.env.EXPECTED_VERSION} at ${process.env.EXPECTED_GIT_HEAD}, got ${pkg.name}@${pkg.version} at ${pkg.gitHead}`);
                process.exit(1);
              }
            });
          '
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Publish with provenance
        run: npm publish "$TARBALL" --provenance --ignore-scripts

  tag:
    name: Create release tag
    runs-on: ubuntu-latest
    needs: [analyze, publish]
    if: >-
      always() && needs.analyze.result == 'success' &&
      needs.analyze.outputs.should_tag == 'true' &&
      (needs.analyze.outputs.should_publish == 'false' || needs.publish.result == 'success')
    permissions:
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Create tag if absent
        env:
          RELEASE_VERSION: ${{ needs.analyze.outputs.version }}
        run: |
          TAG="v$RELEASE_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            TAG_SHA="$(git rev-parse "$TAG^{commit}")"
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "$TAG already exists at $TAG_SHA, expected $GITHUB_SHA" >&2
              exit 1
            fi
            echo "$TAG already points to this release commit"
          else
            git tag -a "$TAG" -m "Release $RELEASE_VERSION" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
